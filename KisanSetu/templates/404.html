
{% extends "base.html" %}

{% block title %}Page Not Found - KisanSetu{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 text-center">

            <div class="display-1 fw-bold text-success">404</div>

            <div class="display-3 mb-3">🌾</div>

            <h1 class="fw-bold mb-3">Oops! Page Not Found</h1>

            <p class="text-muted mb-4">
                The page you are looking for may have been moved,
                deleted, or the link may be incorrect.
            </p>

            <div class="d-flex justify-content-center flex-wrap gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-success">
                    <i class="bi bi-house-door"></i>
                    Go to Homepage
                </a>

                <a href="{{ url_for('crop_list') }}" class="btn btn-outline-success">
                    Explore Crops
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
